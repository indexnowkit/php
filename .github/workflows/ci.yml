name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
          - php: '8.3'
            deps: dbal3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none
      - name: Install (highest)
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --prefer-dist
      - name: Install (lowest)
        if: matrix.deps == 'lowest'
        run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable
      - name: Install (DBAL 3 / ORM 2 / Symfony 6.4)
        if: matrix.deps == 'dbal3'
        run: composer update --no-interaction --prefer-dist --with doctrine/dbal:^3.8 --with doctrine/orm:^2.19 --with symfony/framework-bundle:^6.4
      - run: vendor/bin/phpunit
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none }
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
