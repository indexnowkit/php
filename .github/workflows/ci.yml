name: CI

# Each package is installed and tested on its own, in packages/<name>, against the working copy of its indexnowkit/*
# siblings (bin/link writes composer.monorepo.json with path repositories). Dependency flavours are the
# ci:install:* scripts of the package's composer.json; the split repositories run the same scripts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.package }} / PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, testing, console, sitemap, verify, history, doctrine, symfony-bundle, laravel, yii2, yii3, cli]
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - { package: core, php: '8.2', deps: lowest }
          - { package: testing, php: '8.2', deps: lowest }
          - { package: console, php: '8.2', deps: lowest }
          - { package: sitemap, php: '8.2', deps: lowest }
          - { package: verify, php: '8.2', deps: lowest }
          - { package: history, php: '8.2', deps: lowest }
          - { package: doctrine, php: '8.2', deps: lowest }
          - { package: doctrine, php: '8.3', deps: dbal3 }
          - { package: doctrine, php: '8.4', deps: orm3dbal3 }   # ORM 3 on DBAL 3: the third supported combination (audit 0.13 T6)
          - { package: symfony-bundle, php: '8.2', deps: lowest }
          - { package: symfony-bundle, php: '8.3', deps: symfony64 }
          - { package: symfony-bundle, php: '8.4', deps: symfony8 }
          # highest = Laravel 12 on PHP 8.2, Laravel 13 on 8.3+; lowest = Testbench 10.0 and the oldest Laravel 12 without security
          # advisories; lowest-l13 = the oldest Laravel 13 / Testbench 11.
          - { package: laravel, php: '8.2', deps: lowest }
          - { package: laravel, php: '8.3', deps: lowest-l13 }
          - { package: yii2, php: '8.2', deps: lowest }
          - { package: yii3, php: '8.2', deps: lowest }
          - { package: cli, php: '8.2', deps: lowest }
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: none
      - name: Link the sibling packages
        run: ../../bin/link ${{ matrix.package }}
      - name: Install (${{ matrix.deps }})
        run: composer run ci:install:${{ matrix.deps }}
      # known advisories in what was just installed (roave/security-advisories already blocks them at resolution time; this
      # catches new ones); abandoned packages are reported, not fatal (lowest flavours pull doctrine/cache through ORM 2)
      - run: composer audit --abandoned=report
      - run: vendor/bin/phpunit
      # the generated "One concept, three keys" section of core/docs/configuration.md must match the code (needs the bundle's vendor and the sibling sources)
      - if: matrix.package == 'symfony-bundle' && matrix.deps == 'highest' && matrix.php == '8.3'
        run: php ../../bin/lib/config-table.php --check
      # doctrine on lowest and dbal3 (DBAL 3 / ORM 2): phpstan.dbal3.neon analyses the DBAL 3 connection instead of the DBAL 4 one.
      - run: vendor/bin/phpstan analyse --memory-limit=1G ${{ matrix.package == 'doctrine' && matrix.deps != 'highest' && '-c phpstan.dbal3.neon' || '' }}
      # the test suite at level 6 (phpstan.tests.neon), the harnesses and fixtures included
      - run: vendor/bin/phpstan analyse --memory-limit=1G -c phpstan.tests.neon

  # The adapters without indexnowkit/sitemap, indexnowkit/verify and indexnowkit/history in vendor/ at all. Their own
  # "not installed" tests pass `installed: false` with the packages still installed, which proves the texts, not the boot:
  # an adapter that loaded a class of a package to ask whether it is installed passed them and was a fatal in an
  # application without the package (wave I). Here the three are removed and the detection test of each adapter runs with
  # the env that turns their absence into an assertion (Testing\Conformance\OptionalPackageAssertions).
  optional-packages-absent:
    name: ${{ matrix.package }} / optional packages absent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: symfony-bundle, test: tests/Functional/OptionalPackagesDetectionTest.php }
          - { package: laravel, test: tests/Feature/OptionalPackagesDetectionTest.php }
          - { package: yii2, test: tests/Feature/OptionalPackagesDetectionTest.php }
          - { package: yii3, test: tests/Feature/OptionalPackagesDetectionTest.php }
    env:
      COMPOSER: composer.monorepo.json
      INDEXNOWKIT_OPTIONAL_PACKAGES: absent
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: none
      - run: ../../bin/link ${{ matrix.package }}
      - run: composer run ci:install:highest
      - name: Remove the optional packages
        run: composer remove --dev --no-interaction indexnowkit/sitemap indexnowkit/verify indexnowkit/history
      - name: They are gone
        run: for p in sitemap verify history; do test ! -e "vendor/indexnowkit/$p" || { echo "vendor/indexnowkit/$p is still there"; exit 1; }; done
      - run: vendor/bin/phpunit ${{ matrix.test }}

  # The history PDO store on the databases it ships schemas for: the DDL and the DML run, not just the SQL text.
  history-databases:
    name: history / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: mysql, dsn: 'mysql:host=127.0.0.1;port=3306;dbname=indexnow', extension: pdo_mysql }
          - { database: postgres, dsn: 'pgsql:host=127.0.0.1;port=5432;dbname=indexnow', extension: pdo_pgsql }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: indexnow, MYSQL_DATABASE: indexnow }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pindexnow" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: indexnow, POSTGRES_USER: indexnow, POSTGRES_DB: indexnow }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U indexnow" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COMPOSER: composer.monorepo.json
      INDEXNOWKIT_PDO_DSN: ${{ matrix.dsn }}
      INDEXNOWKIT_PDO_USER: ${{ matrix.database == 'mysql' && 'root' || 'indexnow' }}
      INDEXNOWKIT_PDO_PASSWORD: indexnow
    defaults:
      run:
        working-directory: packages/history
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, ${{ matrix.extension }}
          coverage: none
      - run: ../../bin/link history
      - run: composer run ci:install:highest
      - run: vendor/bin/phpunit --filter PdoStoreKitTest

  coverage:
    name: coverage / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, testing, console, sitemap, verify, history, doctrine, symfony-bundle, laravel, yii2, yii3, cli]
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: pcov
      - name: Link the sibling packages
        run: ../../bin/link ${{ matrix.package }}
      - name: Install (highest)
        run: composer run ci:install:highest
      - run: vendor/bin/phpunit --coverage-clover coverage.xml
      # the floor is the coverage measured when it was set (tests/coverage-floor.txt); below it the job fails
      - run: ../../bin/coverage-floor ${{ matrix.package }} coverage.xml

  # Mutation testing (audit 0.13 T20): Infection over the whole src of the packages whose bugs are silent — the protocol,
  # retries, keys, transactions and URLs of the core, the pre-flight of verify, the sitemap parser, the SQL of history, the
  # masking of console. The floor is packages/<package>/tests/msi-floor.txt (the MSI measured when it was set; raising it
  # is a normal commit, lowering it a separate one with the reason — the ratchet of bin/coverage-floor). Infection is a
  # tool of the monorepo (tools/infection, with its lock): it needs PHP 8.3 while the packages support 8.2. Stage one is
  # non-blocking (continue-on-error) until every floor below is a CI measurement and three weekly runs held it; the PR job
  # below mutates only the changed lines. Locally: bin/mutation <package>.
  mutation:
    name: mutation / ${{ matrix.package }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [core, verify, sitemap, history, console]
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: pcov
          ini-values: memory_limit=1G
      - run: ../../bin/link ${{ matrix.package }}
      - run: composer run ci:install:highest
      - name: Install Infection (tools/infection)
        run: composer install --no-interaction --working-dir ../../tools/infection
        env:
          COMPOSER: composer.json   # the job-wide composer.monorepo.json is the package manifest, not the tool's
      - name: Mutation testing against the floor
        run: |
          mkdir -p ../../var/mutation
          ../../tools/infection/vendor/bin/infection --threads=max --no-progress --no-interaction --logger-github             --logger-summary-json=../../var/mutation/${{ matrix.package }}.summary.json             --min-msi="$(tr -d '[:space:]' < tests/msi-floor.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.package }}
          path: var/mutation/${{ matrix.package }}.*
          if-no-files-found: ignore

  # The same on a pull request, for the lines the pull request changes only (--git-diff-lines against the base branch):
  # every escaped mutant is an annotation on the diff, and a change whose new lines let mutants escape fails the job.
  mutation-diff:
    name: mutation / ${{ matrix.package }} / changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true   # stage one, with the mutation job above
    strategy:
      fail-fast: false
      matrix:
        package: [core, verify, sitemap, history, console]
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: pcov
          ini-values: memory_limit=1G
      - run: ../../bin/link ${{ matrix.package }}
      - run: composer run ci:install:highest
      - run: composer install --no-interaction --working-dir ../../tools/infection
        env:
          COMPOSER: composer.json
      - name: Mutation testing of the changed lines
        run: |
          mkdir -p ../../var/mutation
          ../../tools/infection/vendor/bin/infection --threads=max --no-progress --no-interaction --logger-github             --git-diff-lines --git-diff-base="origin/${{ github.base_ref }}" --ignore-msi-with-no-mutations             --min-msi="$(tr -d '[:space:]' < tests/msi-floor.txt)"

  # The three packagings of the CLI (spec 19b §3.6–§3.8): the PHAR built with Box the way the release workflow of php-cli
  # builds it (bin/phar), run against the mock IndexNow server of indexnowkit/testing — the one place the PHAR-specific
  # things are proved (the autoloader, no php-http/discovery, the state file next to a PHAR); the Docker image built from
  # it without a push (the `cli` target runs as uid 1000, the `action` target as root); the entrypoint of the GitHub Action
  # with INPUT_* variables against the same mock server (bin/action-smoke).
  cli-packagings:
    name: cli / phar, docker, action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, xmlreader, zlib, mbstring
          coverage: none
          ini-values: phar.readonly=0
      - name: Build the PHAR (the steps of bin/phar on the runner's PHP)
        run: |
          set -euo pipefail
          mkdir -p var/phar/siblings
          for d in packages/*/; do n="$(basename "$d")"; [ "$n" = cli ] && continue; mkdir -p "var/phar/siblings/$n"; tar -C "$d" --exclude=vendor --exclude=tests --exclude=docs --exclude=.phpunit.cache --exclude='composer.monorepo.*' --exclude='*.md' -cf - . | tar -C "var/phar/siblings/$n" -xf -; done
          mkdir -p var/phar/cli && cp -R packages/cli/bin packages/cli/src packages/cli/composer.json packages/cli/box.json var/phar/cli/
          php -r '$b = $argv[1]; $m = json_decode(file_get_contents("$b/composer.json"), true); foreach (glob($argv[2] . "/*/composer.json") as $s) { $sm = json_decode(file_get_contents($s), true); $m["repositories"][] = ["type" => "path", "url" => dirname($s), "options" => ["symlink" => false, "versions" => [$sm["name"] => $sm["extra"]["branch-alias"]["dev-main"]]]]; } $m["minimum-stability"] = "dev"; $m["prefer-stable"] = true; file_put_contents("$b/composer.json", json_encode($m, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));' "$PWD/var/phar/cli" "$PWD/var/phar/siblings"
          composer install -d var/phar/cli --no-dev --no-interaction --prefer-dist --classmap-authoritative
          composer global require humbug/box:^4.7 --no-interaction
          cd var/phar/cli && git init -q && git -c user.name=ci -c user.email=ci@indexnowkit.dev add -A && git -c user.name=ci -c user.email=ci@indexnowkit.dev commit -qm build && git tag "dev-${GITHUB_SHA::7}"
          "$(composer global config bin-dir --absolute --quiet)/box" compile --no-interaction
          cp indexnow.phar ../../../packages/cli/indexnow.phar
      - name: The PHAR against the mock IndexNow server
        env:
          MOCK_KEYS: abcdef1234567890abcdef1234567890
          INDEXNOW_KEY: abcdef1234567890abcdef1234567890
          INDEXNOW_BASE_URL: http://127.0.0.1:8089
          INDEXNOW_KEY_LOCATION: http://127.0.0.1:8089/abcdef1234567890abcdef1234567890.txt
          INDEXNOW_ENGINES: http://127.0.0.1:8089/indexnow
          INDEXNOW_ENV: prod
          INDEXNOW_STRICT_HOSTS: 'true'
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8089 packages/testing/resources/mock-server/router.php >/dev/null 2>&1 &
          sleep 1
          cd "$(mktemp -d)"
          php "$GITHUB_WORKSPACE/packages/cli/indexnow.phar" --version | grep -E '^indexnow dev-'
          php "$GITHUB_WORKSPACE/packages/cli/indexnow.phar" check --json | tee check.json
          php -r '$r = json_decode(file_get_contents("check.json"), true); exit($r["status"] === "ok" ? 0 : 1);'
          php "$GITHUB_WORKSPACE/packages/cli/indexnow.phar" submit --json http://127.0.0.1:8089/a | tee submit.json
          php -r '$r = json_decode(file_get_contents("submit.json"), true); exit($r[0]["status"] === "ok" ? 0 : 1);'
          test -f .indexnow/state.sqlite
          php "$GITHUB_WORKSPACE/packages/cli/indexnow.phar" status | grep -F 'store state (SqliteCache)'
      - name: Build the image (both targets, no push)
        run: |
          docker build --target cli -t indexnow-cli-test packages/cli
          docker build --target action -t indexnow-action-test packages/cli
      - name: Smoke the cli image
        run: |
          docker run --rm indexnow-cli-test --version | grep -E '^indexnow dev-'
          test "$(docker run --rm --entrypoint id indexnow-cli-test -u)" = 1000
          docker run --rm -e INDEXNOW_KEY=abcdef1234567890abcdef1234567890 -e INDEXNOW_BASE_URL=https://www.example.com -e INDEXNOW_STATE=memory -e INDEXNOW_DRY_RUN=true indexnow-cli-test config --json | php -r '$c = json_decode(stream_get_contents(STDIN), true); exit($c["adapter"]["cli"]["state"] === "memory" ? 0 : 1);'
      - name: Smoke the action entrypoint
        run: bin/action-smoke indexnow-action-test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none }
      - name: Validate the package manifests
        run: for p in packages/*/; do composer validate --strict --no-check-lock --working-dir "$p"; done
      - name: Coding standard
        run: bin/cs check
