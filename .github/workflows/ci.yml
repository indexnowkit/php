name: CI

# Each package is installed and tested on its own, in packages/<name>, against the working copy of its indexnowkit/*
# siblings (bin/link writes composer.monorepo.json with path repositories). Dependency flavours are the
# ci:install:* scripts of the package's composer.json; the split repositories run the same scripts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.package }} / PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, testing, console, sitemap, doctrine, symfony-bundle, laravel, yii2]
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - { package: core, php: '8.2', deps: lowest }
          - { package: testing, php: '8.2', deps: lowest }
          - { package: console, php: '8.2', deps: lowest }
          - { package: sitemap, php: '8.2', deps: lowest }
          - { package: doctrine, php: '8.2', deps: lowest }
          - { package: doctrine, php: '8.3', deps: dbal3 }
          - { package: symfony-bundle, php: '8.2', deps: lowest }
          - { package: symfony-bundle, php: '8.3', deps: symfony64 }
          # highest = Laravel 12 on PHP 8.2, Laravel 13 on 8.3+; lowest = Testbench 10.0 and the oldest Laravel 12 without security advisories.
          - { package: laravel, php: '8.2', deps: lowest }
          - { package: yii2, php: '8.2', deps: lowest }
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: none
      - name: Link the sibling packages
        run: ../../bin/link ${{ matrix.package }}
      - name: Install (${{ matrix.deps }})
        run: composer run ci:install:${{ matrix.deps }}
      # known advisories in what was just installed (roave/security-advisories already blocks them at resolution time; this
      # catches new ones); abandoned packages are reported, not fatal (lowest flavours pull doctrine/cache through ORM 2)
      - run: composer audit --abandoned=report
      - run: vendor/bin/phpunit
      # the generated "One concept, three keys" section of core/docs/configuration.md must match the code (needs the bundle's vendor and the sibling sources)
      - if: matrix.package == 'symfony-bundle' && matrix.deps == 'highest' && matrix.php == '8.3'
        run: php ../../bin/lib/config-table.php --check
      # doctrine on lowest and dbal3 (DBAL 3 / ORM 2): phpstan.dbal3.neon analyses the DBAL 3 connection instead of the DBAL 4 one.
      - run: vendor/bin/phpstan analyse --memory-limit=1G ${{ matrix.package == 'doctrine' && matrix.deps != 'highest' && '-c phpstan.dbal3.neon' || '' }}

  coverage:
    name: coverage / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, sitemap]
    env:
      COMPOSER: composer.monorepo.json
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, xmlreader, zlib
          coverage: pcov
      - name: Link the sibling packages
        run: ../../bin/link ${{ matrix.package }}
      - name: Install (highest)
        run: composer run ci:install:highest
      - run: vendor/bin/phpunit --coverage-clover coverage.xml
      # the floor is the coverage measured when it was set (tests/coverage-floor.txt); below it the job fails
      - run: ../../bin/coverage-floor ${{ matrix.package }} coverage.xml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none }
      - name: Validate the package manifests
        run: for p in packages/*/; do composer validate --strict --no-check-lock --working-dir "$p"; done
      - name: Coding standard
        run: bin/cs check
